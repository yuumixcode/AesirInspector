name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  pull-requests: write
  contents: read

jobs:
  ai_code_review:
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_AI_CODE_REVIEW != 'false' }}

    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      # 解决 GitHub Actions Node.js 16 弃用警告 (actions/runner#2905)
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r .github/codereview/requirements.txt

      - name: Install Codely CLI
        run: |
          curl -fsSL https://codesearch-plugins.tos-cn-shanghai.volces.com/codely-cli/install.sh | bash

      - name: Run AI Code Review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODELY_TOKEN: ${{ secrets.CODELY_TOKEN }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          echo "Starting AI code review for PR #${{ github.event.pull_request.number }}"
          python .github/codereview/ai-code-review.py

      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-review-report
          path: |
            ai_review_codely.txt
            response_codely.json
          retention-days: 90
